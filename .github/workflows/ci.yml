# Fast verification — master pushes and PRs.
#
# Mirrors `substrate/ring`'s own CI structure and this project's CLAUDE.md
# Level 1-3 verification commands (nextest, doctests, clippy). Deliberately
# has no fmt job: CLAUDE.md forbids `cargo fmt` for this project's custom
# codestyle, unlike `ring`'s own CI which still runs a nightly fmt check.

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: nextest + doctests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: nextest
        run: cargo nextest run --workspace --all-features
      # The default build (no `i128` on `exact_minor`) is what every downstream
      # dependency gets, so it is tested too, not only the all-features one.
      # The timing bench already ran in the step above; it is skipped here.
      - name: nextest (default features)
        run: cargo nextest run --workspace -E 'not binary(bench_vs_f64)'
      - name: doctests
        run: RUSTDOCFLAGS="-D warnings" cargo test --doc --workspace --all-features

  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

  doc:
    name: cargo doc --no-deps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc, warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --all-features
