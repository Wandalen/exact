[workspace]
resolver = "3"
members = [
  "module/exact_add",
  "module/exact_arith",
  "module/exact_bytes",
  "module/exact_cmp",
  "module/exact_conserve",
  "module/exact_dust",
  "module/exact_fmt",
  "module/exact_kind",
  "module/exact_minor",
  "module/exact_parse",
  "module/exact_ratio",
  "module/exact_round",
  "module/exact_scale",
  "module/exact_sign",
  "module/exact_snap",
  "module/smoke_exact_market_split",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Wandalen/exact"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe-code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
