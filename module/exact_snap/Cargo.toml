[package]
name = "exact_snap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Snap a price or quantity to the nearest tick or lot grid point, for exact's fixed-point value types"

[dependencies]
# `PriceAt` and `Qty`, the values a tick and a lot snap.
exact_kind = { path = "../exact_kind", version = "0.1.0" }
# `round_div` and `Rounding` — the snap is that division, shared with exact_ratio.
exact_round = { path = "../exact_round", version = "0.1.0" }
# `MONEY_SCALE`, only to fix the `Tick`/`Lot` aliases; everything else here is
# generic over the scale (docs/decisions/001_tick_and_lot_generic_over_scale.md).
exact_scale = { path = "../exact_scale", version = "0.1.0" }

[lints]
workspace = true
